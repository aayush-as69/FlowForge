# Render Blueprint: one Docker web service (Next.js + FastAPI) and a managed PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo. Fill the three "sync: false" values when prompted.
databases:
  - name: flowforge-db
    plan: free            # free databases expire after a trial period; use a paid plan for anything you keep
    databaseName: flowforge
    user: flowforge

services:
  - type: web
    name: flowforge
    runtime: docker
    plan: free            # sleeps when idle; first request after a pause is slow
    healthCheckPath: /api/health
    dockerCommand: sh scripts/render-start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: FF_SEED
        value: "0"
      - key: FF_DEMO_MODE
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-db
          property: connectionString
      # First administrator, created on first start. Remove both after the first successful deploy.
      - key: FLOWFORGE_ADMIN_EMAIL
        sync: false
      - key: FLOWFORGE_ADMIN_PASSWORD
        sync: false   # at least 14 characters
      - key: FLOWFORGE_ORG_NAME
        sync: false
